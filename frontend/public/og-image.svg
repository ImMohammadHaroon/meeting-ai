<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Meeting AI  AI-powered meeting platform">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <text x="600" y="250" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" font-weight="800">Meeting AI</text>
  <text x="600" y="330" text-anchor="middle" fill="#a3a3a3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="32" font-weight="500">Transcribe · Summarize · Live rooms · AI Q&amp;A</text>
  <text x="600" y="400" text-anchor="middle" fill="#737373" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="24">meetingai.dev</text>
  <circle cx="600" cy="500" r="8" fill="#ffffff" opacity="0.6"/>
</svg>
